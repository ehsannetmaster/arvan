# kube-prometheus-stack values — Arvan lab cluster
# Chart: kube-prometheus-stack 86.2.0  (prometheus-operator v0.91.0)
#
# Cluster conventions (see kube-prometheus-stack-argocd.md / argocd-ingress.md):
#   * TLS is terminated at the EXTERNAL nginx; ingress-nginx speaks plain HTTP.
#     -> no `tls:` blocks here; Ingresses use *.idistance.ir + ingressClassName nginx.
#   * No LoadBalancer (no MetalLB) -> every Service stays ClusterIP, reached via Ingress.
#   * Persistence uses the static `local-storage` StorageClass — pre-created
#     `local` PVs on node3 (no provisioner). Sizes below MUST match the PVs.

fullnameOverride: kps

#############################################
# Grafana
#############################################
grafana:
  enabled: true
  # Admin credentials come from a Secret created OUT OF BAND — never committed to
  # this PUBLIC repo. Create it once on the cluster 
  #   kubectl -n monitoring create secret generic grafana-admin \
  #     --from-literal=admin-user=admin \
  #     --from-literal=admin-password='<your-password>'
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.idistance.ir
    path: /
    pathType: Prefix
    # No tls: — TLS is offloaded at the external nginx.

  persistence:
    enabled: true
    type: pvc
    storageClassName: local-storage
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

  deploymentStrategy:
    type: Recreate

  # Grafana sits behind the external nginx (https). Tell it its public URL so it
  # builds correct https links/redirects regardless of the proxy hop scheme.
  grafana.ini:
    server:
      root_url: https://grafana.idistance.ir

  # Inject the ip_lookups DB password as an env var, sourced from a Secret
  # created OUT OF BAND in the `monitoring` namespace (this is a PUBLIC repo, and
  # the postgresql-ha-credentials Secret lives in `arvan` — secretKeyRef cannot
  # cross namespaces). Create it once on the cluster:
  #   kubectl -n monitoring create secret generic ip-lookups-db \
  #     --from-literal=password="$(kubectl -n arvan get secret postgresql-ha-credentials \
  #       -o jsonpath='{.data.password}' | base64 -d)"
  envValueFrom:
    PG_DB_PASSWORD:
      secretKeyRef:
        name: ip-lookups-db
        key: password

  # PostgreSQL data source for the ip-country-api request log. The password is
  # interpolated from the env var above ($PG_DB_PASSWORD) — never stored here.
  # Reached cross-namespace via the Pgpool proxy FQDN.
  additionalDataSources:
    - name: ip-lookups
      type: postgres
      uid: ip-lookups-pg
      access: proxy
      url: postgresql-ha-pgpool.arvan.svc.cluster.local:5432
      database: appdb
      user: appuser
      secureJsonData:
        password: $PG_DB_PASSWORD
      jsonData:
        sslmode: disable

#############################################
# Prometheus
#############################################
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.idistance.ir
    paths:
      - /
    pathType: Prefix

  prometheusSpec:
    externalUrl: https://prometheus.idistance.ir
    retention: 15d
    # Size-based cap: delete oldest blocks once on-disk data exceeds 9GB.
    # Sits just under the 10Gi PV (~84%), leaving headroom for WAL/compaction.
    retentionSize: "9GB"
    # In a lab you often add ServiceMonitors/Rules without the chart's release
    # label — tell Prometheus to pick up ALL of them, not just the chart's own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-storage
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

#############################################
# Alertmanager
#############################################
alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - alertmanager.idistance.ir
    paths:
      - /
    pathType: Prefix

  alertmanagerSpec:
    externalUrl: https://alertmanager.idistance.ir
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-storage
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

#############################################
# Control-plane component scraping (Kubespray specifics)
#############################################
# Kubespray binds kube-controller-manager / kube-scheduler / kube-proxy metrics
# to 127.0.0.1 by default, so these targets show DOWN in Prometheus until you
# flip their bind-address to 0.0.0.0 cluster-side. Left enabled — see the doc's
# "Known gaps" section for the kubespray vars to change.
kubeControllerManager:
  service:
    enabled: true
kubeScheduler:
  service:
    enabled: true

# etcd needs client certs to scrape on kubespray. Disabled to avoid a permanent
# "etcd down" alert; enable + wire certs later if you want etcd metrics.
kubeEtcd:
  enabled: false
