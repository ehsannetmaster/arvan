apiVersion: apps/v1
kind: Deployment
metadata:
  name: ip-country-api
  namespace: arvan
  labels:
    app: ip-country-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ip-country-api
  template:
    metadata:
      labels:
        app: ip-country-api
    spec:
      containers:
        - name: ip-country-api
          # The tag below is rewritten by CI (.github/workflows/ip-country-api.yml)
          # to the built commit SHA on every push, then committed back to git.
          image: ghcr.io/ehsannetmaster/ip-country-api:90c0f65
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Postgres connection (via the Pgpool proxy). asyncpg reads these
          # standard PG* vars automatically. Password comes from the same
          # out-of-band Secret the postgresql-ha chart uses (key: password = the
          # appuser password). DB outages don't break the API — logging just
          # degrades to a no-op.
          env:
            - name: PGHOST
              value: postgresql-ha-pgpool.arvan.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: appdb
            - name: PGUSER
              value: appuser
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-ha-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
